[tasks.test-misc]
dependencies = [
    "test-no-alloc",
    "test-proptest",
    "test-rust-fuzz",
    "test-rocket-traits",
    "test-borsh",
    "test-rand"
]

[tasks.test-no-alloc]
dependencies = ["install-no-alloc-target"]
command = "cargo"
args = ["build", "--no-default-features", "--target", "x86_64-unknown-none"]

[tasks.install-no-alloc-target]
command = "rustup"
args = ["target", "add", "x86_64-unknown-none"]

[tasks.test-proptest]
command = "cargo"
args = ["test", "--workspace", "--no-default-features", "--features=proptest", "--test", "proptest_tests"]

[tasks.test-rust-fuzz]
command = "cargo"
args = ["test", "--workspace", "--no-default-features", "--features=rust-fuzz", "--test", "rust_fuzz_tests"]

[tasks.test-rocket-traits]
command = "cargo"
args = ["test", "--workspace", "--features=rocket-0_5-traits", "--test", "rocket_tests"]

[tasks.test-borsh]
command = "cargo"
args = ["test", "--workspace", "--features=borsh", "--test", "borsh_tests"]

[tasks.test-ndarray]
command = "cargo"
args = ["test", "--workspace", "--features=ndarray-0_16", "--test", "ndarray_tests"]

[tasks.test-rand]
dependencies = [
    "test-rand-0_9"
]

[tasks.test-rand-0_9]
command = "cargo"
args = ["test", "--workspace", "--features=rand-0_9", "rand_tests"]
