[tasks.test-misc]
dependencies = [
    "test-no-alloc",
    "test-proptest",
    "test-arbitrary",
    "test-borsh",
    "test-bytemuck",
    "test-ndarray",
    "test-rand"
]

[tasks.test-no-alloc]
dependencies = ["install-no-alloc-target"]
command = "cargo"
args = ["build", "--no-default-features", "--target", "x86_64-unknown-none"]

[tasks.install-no-alloc-target]
command = "rustup"
args = ["target", "add", "x86_64-unknown-none"]

[tasks.test-proptest]
command = "cargo"
args = ["test", "-p", "rust_decimal_proptest"]

[tasks.test-arbitrary]
command = "cargo"
args = ["test", "-p", "rust_decimal_arbitrary"]

[tasks.test-borsh]
command = "cargo"
args = ["test", "-p", "rust_decimal_borsh"]

[tasks.test-bytemuck]
command = "cargo"
args = ["test", "-p", "rust_decimal_bytemuck"]

[tasks.test-ndarray]
command = "cargo"
args = ["test", "-p", "rust_decimal_ndarray"]

[tasks.test-rand]
command = "cargo"
args = ["test", "-p", "rust_decimal_rand", "--all-features"]
