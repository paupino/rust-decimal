[tasks.test-db]
dependencies = [
    "test-db-mysql-all",
    "test-db-postgres-all"
]

[tasks.test-db-postgres-all]
dependencies = [
    "test-db-postgres",
    "test-db-diesel-postgres"
]

# Covers both `postgres` and `tokio-postgres`
[tasks.test-db-postgres]
command = "cargo"
args = ["test", "-p", "rust_decimal_postgres", "-p", "rust_decimal_pg_numeric"]

[tasks.test-db-mysql-all]
dependencies = [
    "test-db-diesel-mysql",
]

[tasks.test-db-diesel]
dependencies = [
    "test-db-diesel-mysql",
    "test-db-diesel-postgres",
]

[tasks.test-db-diesel-mysql]
command = "cargo"
args = ["test", "-p", "rust_decimal_diesel", "--features=mysql", "mysql"]

[tasks.test-db-diesel-postgres]
command = "cargo"
args = ["test", "-p", "rust_decimal_diesel", "--features=postgres", "postgres"]
