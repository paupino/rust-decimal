[tasks.test-serde]
dependencies = [
    "test-serde-default",
    "test-serde-number",
    "test-serde-arbitrary-precision",
    "test-serde-number-arbitrary-precision",
]

[tasks.test-serde-default]
command = "cargo"
args = ["test", "--workspace", "--features=serde", "--lib", "--test", "serde_tests"]

[tasks.test-serde-number]
command = "cargo"
args = ["test", "--workspace", "--features=serde-default-number", "--lib", "--test", "serde_tests"]

[tasks.test-serde-arbitrary-precision]
command = "cargo"
args = ["test", "--workspace", "--features=serde-default-arbitrary-precision", "--lib", "--test", "serde_tests"]

[tasks.test-serde-number-arbitrary-precision]
command = "cargo"
args = ["test", "--workspace", "--features=serde-default-number,serde-default-arbitrary-precision", "--lib", "--test", "serde_tests"]
