[tasks.test-serde]
dependencies = [
    "test-serde-default",
    "test-serde-number",
    "test-serde-exact",
    "test-serde-number-exact",
]

[tasks.test-serde-default]
command = "cargo"
args = ["test", "--workspace", "--features=serde", "--lib", "--test", "serde_tests"]

[tasks.test-serde-number]
command = "cargo"
args = ["test", "--workspace", "--features=serde-default-number", "--lib", "--test", "serde_tests"]

[tasks.test-serde-exact]
command = "cargo"
args = ["test", "--workspace", "--features=serde-default-exact", "--lib", "--test", "serde_tests"]

[tasks.test-serde-number-exact]
command = "cargo"
args = ["test", "--workspace", "--features=serde-default-number,serde-default-exact", "--lib", "--test", "serde_tests"]
