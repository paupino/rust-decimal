[package]
authors = ["Paul Mason <paul@form1.co.nz>"]
build = "build.rs"
categories = ["science", "mathematics", "data-structures", "no-std", "no-std::no-alloc"]
description = "Decimal number implementation written in pure Rust suitable for financial and fixed-precision calculations."
documentation = "https://docs.rs/rust_decimal/"
edition = "2024"
exclude = ["tests/generated/*"]
keywords = ["decimal", "financial", "fixed", "precision", "number"]
license = "MIT"
name = "rust_decimal"
readme = "./README.md"
repository = "https://github.com/paupino/rust-decimal"
rust-version = "1.85.0"
version = "2.0.0-alpha.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
arrayvec = { default-features = false, version = "0.7" }
num-traits = { default-features = false, features = ["i128"], package = "num-traits", version = "0.2" }
rust_decimal_macros = { path = "macros", default-features = false, optional = true, version = "=2.0.0-alpha.0" }
serde = { default-features = false, optional = true, version = "1" }
serde_json = { default-features = false, optional = true, version = "1" }
zmij = { default-features = false, optional = true, version = "1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { default-features = false, version = "0.2", optional = true }

[dev-dependencies]
criterion = { default-features = false, version = "0.5" }
csv = "1"
rust_decimal_macros = { path = "macros" }
serde = { default-features = false, features = ["derive"], version = "1.0" }
serde_json = "1.0"
version-sync = { default-features = false, features = ["html_root_url_updated", "markdown_deps_updated"], version = "0.9" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = { default-features = false, version = "0.2" }
wasm-bindgen-test = { version = "0.3" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bincode = { default-features = false, version = "1.0" }
rust_decimal = { path = ".", features = ["macros"] }
rkyv-0_8 = { version = "0.8", package = "rkyv" }

[features]
default = ["alloc", "serde", "std"]

align16 = [] # Force Decimal to be repr(align16) - the same as u128
alloc = []
c-repr = [] # Force Decimal to be repr(C)
macros = ["dep:rust_decimal_macros"]
maths = ["alloc"]
maths-nopanic = ["maths"]
serde = ["alloc", "dep:serde", "wasm-bindgen?/serde"]
serde-arbitrary-precision = ["serde-with-arbitrary-precision"]
serde-bincode = ["serde-str"] # Backwards compatability
serde-float = ["serde-with-float"]
serde-str = ["serde-with-str"]
serde-with-arbitrary-precision = ["serde", "serde_json/arbitrary_precision", "serde_json/std", "zmij"]
serde-with-float = ["serde"]
serde-with-str = ["serde"]
std = ["alloc", "arrayvec/std", "serde?/std", "serde_json?/std", "wasm-bindgen?/std"]
wasm = ["dep:wasm-bindgen"]

[[bench]]
harness = false
name = "comparison"
path = "benches/comparison.rs"

[[bench]]
harness = false
name = "perf_ops"
path = "benches/perf_ops.rs"

[[test]]
name = "generated"
path = "tests/generated.rs"
test = false

[[test]]
name = "serde_tests"
path = "tests/serde_tests.rs"
required-features = ["serde"]

[[example]]
name = "rkyv-remote"
required-features = ["macros"]

[workspace]
# Plain `cargo test` / `cargo build` cover the core crates only; integrations are run per crate.
default-members = [".", "./macros"]
members = [
    ".",
    "./integrations/*",
    "./macros",
]
resolver = "2"
