[package]
authors = ["Paul Mason <paul@form1.co.nz>"]
categories = ["science", "mathematics", "data-structures"]
description = "arbitrary support for rust_decimal."
documentation = "https://docs.rs/rust_decimal_arbitrary/"
edition = "2024"
keywords = ["decimal", "arbitrary", "fuzz"]
license = "MIT"
name = "rust_decimal_arbitrary"
repository = "https://github.com/paupino/rust-decimal"
rust-version = "1.85.0"
version = "2.0.0-alpha.0"

[dependencies]
arbitrary = { default-features = false, version = "1.2" }
rust_decimal = { default-features = false, path = "../..", version = "=2.0.0-alpha.0" }

[dev-dependencies]
arbitrary = { features = ["derive"], version = "1.2" }
