[package]
authors = ["Paul Mason <paul@form1.co.nz>"]
categories = ["science", "mathematics", "data-structures"]
description = "ndarray scalar support for rust_decimal."
documentation = "https://docs.rs/rust_decimal_ndarray/"
edition = "2024"
keywords = ["decimal", "ndarray", "array"]
license = "MIT"
name = "rust_decimal_ndarray"
repository = "https://github.com/paupino/rust-decimal"
rust-version = "1.85.0"
version = "2.0.0-alpha.0"

[dependencies]
ndarray = { default-features = false, version = "0.16" }
rust_decimal = { default-features = false, path = "../..", version = "=2.0.0-alpha.0" }
