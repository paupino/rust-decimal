[package]
authors = ["Paul Mason <paul@form1.co.nz>"]
categories = ["science", "mathematics", "data-structures"]
description = "Diesel support for rust_decimal."
documentation = "https://docs.rs/rust_decimal_diesel/"
edition = "2024"
keywords = ["decimal", "diesel", "database", "postgres", "mysql"]
license = "MIT"
name = "rust_decimal_diesel"
repository = "https://github.com/paupino/rust-decimal"
rust-version = "1.85.0"
version = "2.0.0-alpha.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
diesel = { default-features = false, version = "2.2.3" }
rust_decimal = { default-features = false, features = ["std"], path = "../..", version = "=2.0.0-alpha.0" }
rust_decimal_pg_numeric = { optional = true, path = "../pg-numeric", version = "=2.0.0-alpha.0" }

[dev-dependencies]
diesel = { default-features = false, features = ["mysql", "postgres"], version = "2.2.3" }

[features]
default = []
mysql = ["diesel/mysql_backend"]
postgres = ["diesel/postgres_backend", "dep:rust_decimal_pg_numeric"]
