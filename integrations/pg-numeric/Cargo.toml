[package]
authors = ["Paul Mason <paul@form1.co.nz>"]
categories = ["science", "mathematics", "data-structures"]
description = "PostgreSQL NUMERIC conversion for rust_decimal, shared by rust_decimal_postgres and rust_decimal_diesel."
documentation = "https://docs.rs/rust_decimal_pg_numeric/"
edition = "2024"
keywords = ["decimal", "postgres", "numeric"]
license = "MIT"
name = "rust_decimal_pg_numeric"
repository = "https://github.com/paupino/rust-decimal"
rust-version = "1.85.0"
version = "2.0.0-alpha.0"

[dependencies]
rust_decimal = { default-features = false, path = "../..", version = "=2.0.0-alpha.0" }
